# Local development / quick test on any machine:  docker compose up --build
# (Production uses PM2 on the deployment server - see README.)
services:
  backend:
    build: ./backend
    ports: ["3000:3000"]
    environment:
      - APP_VERSION=dev

  frontend:
    image: node:20-alpine
    working_dir: /app
    volumes: ["./frontend:/app"]
    command: sh -c "npm install && npm run dev -- --host"
    ports: ["5173:5173"]
    depends_on: [backend]
    environment:
      - VITE_API_TARGET=http://backend:3000
